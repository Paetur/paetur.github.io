name: RSVP guest security smoke checks
on:
  pull_request:
    paths:
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - 'index.html'
      - 'supabase/**'
      - '.github/workflows/rsvp-security-smoke.yml'
      - 'tests/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate admin JavaScript
        run: node --check js/admin.js && node --check tests/admin-layout.cjs
      - name: Test compact admin layout with mocked data
        run: node tests/admin-layout.cjs
      - name: Upload light and dark browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-design-browser-preview
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Check deployed site and guest gateway
        run: node tests/rsvp-smoke.cjs
