name: RSVP guest security smoke checks
on:
  pull_request:
    paths:
      - 'js/**'
      - 'admin/**'
      - 'css/**'
      - 'index.html'
      - 'setup.html'
      - 'supabase/**'
      - '.github/workflows/rsvp-security-smoke.yml'
      - 'tests/**'
      - 'package*.json'
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  household-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rsvp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test household lifecycle and concurrent operations in disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:test-only@localhost:5432/rsvp_test
        run: |
          node tests/admin-invitations.cjs
          node tests/admin-auth.cjs
          node tests/timezones.cjs
          node tests/household-management-db.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use HTTPS Ubuntu mirror and bounded package retries
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          for source in sources:
              if source.is_file():
                  text = source.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      source.write_text(updated)
          Path('/etc/apt/apt.conf.d/99-rsvp-network').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n')
          PY
      - name: Install pinned Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Validate admin JavaScript
        run: node --check js/admin.js && node --check tests/admin-layout.cjs
      - name: Test administrator credentials with real SDK in Chromium and WebKit
        run: node tests/admin-auth-browser.cjs
      - name: Test FO/EN/DE interfaces and customization in Chromium and WebKit
        run: node tests/interface-localization.cjs
      - name: Test compact admin layout with mocked data
        run: node tests/admin-layout.cjs
      - name: Upload light and dark browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-design-browser-preview
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Check deployed site and guest gateway
        run: node tests/rsvp-smoke.cjs

