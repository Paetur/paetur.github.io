name: RSVP guest security smoke checks
on:
  pull_request:
    paths:
      - 'js/**'
      - 'admin/**'
      - 'index.html'
      - 'supabase/**'
      - '.github/workflows/rsvp-security-smoke.yml'
      - 'tests/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check deployed site and guest gateway
        run: node tests/rsvp-smoke.cjs
